version: '3.8'

services:
  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: daiminh-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8000
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - daiminh-network

  postgres:
    image: postgres:15-alpine
    container_name: daiminh-postgres-prod
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=daiminh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - daiminh-network

  redis:
    image: redis:7-alpine
    container_name: daiminh-redis-prod
    restart: always
    networks:
      - daiminh-network

  minio:
    image: minio/minio:latest
    container_name: daiminh-minio-prod
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /minio_data --console-address ":9001"
    restart: always
    networks:
      - daiminh-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  daiminh-network:
    driver: bridge
